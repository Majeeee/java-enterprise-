# Profil: dev (H2 i minnet)
spring.profiles.active=dev

# Server
server.port=8080

# Applikationsnamn
spring.application.name=scb-migration-api

# JWT
jwt.secret=${JWT_SECRET:local-dev-secret-key-minimum-256-bits-long-change-me}
jwt.expiration-ms=86400000

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kökonfiguration
rabbitmq.queue.email=email.queue
rabbitmq.exchange=scb.exchange
rabbitmq.routing-key.email=email.routing.key

# Logging
logging.level.se.scb=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
