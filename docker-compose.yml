services:
  postgres:
    image: postgres:16-alpine
    container_name: scb-postgres
    environment:
      POSTGRES_DB: scb_migrations
      POSTGRES_USER: scb
      POSTGRES_PASSWORD: scb_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: scb-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: scb-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scb_migrations
      SPRING_DATASOURCE_USERNAME: scb
      SPRING_DATASOURCE_PASSWORD: scb_secret
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-256-bits
      MAIL_USERNAME: ${MAIL_USERNAME:-test@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/docs > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  email-service:
    build: ./email-service
    container_name: scb-email-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      MAIL_USERNAME: ${MAIL_USERNAME:-test@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: scb-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
